<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2: Skills Assessment | Uganda National IT Skills Assessment 2026</title>
    <link rel="stylesheet" href="survey.css">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <img src="/images/logo.jpg" alt="Uganda Coat of Arms" style="max-width:80px;">
            <h1>National Information Technology Authority — Uganda</h1>
        </div>
    </header>

    <section class="survey-banner">
        <img src="/images/survey.jpg" alt="Uganda National IT Skills Assessment 2026 Banner" class="banner-image">
        <div class="banner-overlay">
            <h2>Uganda National IT Skills Assessment 2026</h2>
        </div>
    </section>

    <nav class="progress-container" aria-label="Survey Progress">
        <ol class="progress-steps">
            <li class="step"><a href="index.html">Step 1 — Respondent Details</a></li>
            <li class="step active">Step 2 — Skills Assessment</li>
            <li class="step"><a href="step3.html">Step 3 — Submit</a></li>
        </ol>
    </nav>

    <main class="survey-main">
        <div class="respondent-banner" id="respondent-greeting"></div>

        <form action="step3.html" method="get" class="survey-form" id="skills-form">
            <fieldset class="respondent-fieldset">
                <legend>Skills Assessment</legend>

                <div class="form-group">
                    <label for="primary-domain">Primary IT Domain</label>
                    <select id="primary-domain" name="primary_domain" required>
                        <option value="">-- Select Primary Domain --</option>
                        <option value="Software & Web Development">Software & Web Development</option>
                        <option value="Networking & Infrastructure">Networking & Infrastructure</option>
                        <option value="Cybersecurity & Information Assurance">Cybersecurity & Information Assurance</option>
                        <option value="Database Administration & Data Science">Database Administration & Data Science</option>
                        <option value="General Digital Literacy">General Digital Literacy</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="experience">Years of IT Experience</label>
                    <select id="experience" name="experience" required>
                        <option value="">-- Select Experience Level --</option>
                        <option value="Less than 1 year">Less than 1 year</option>
                        <option value="1 – 3 years">1 – 3 years</option>
                        <option value="4 – 6 years">4 – 6 years</option>
                        <option value="7+ years">7+ years</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Overall Proficiency Level</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" name="proficiency" value="Beginner" required> Beginner</label>
                        <label class="radio-label"><input type="radio" name="proficiency" value="Intermediate"> Intermediate</label>
                        <label class="radio-label"><input type="radio" name="proficiency" value="Advanced"> Advanced</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="certifications">Relevant IT Certifications (Optional)</label>
                    <input type="text" id="certifications" name="certifications" placeholder="e.g., CCNA, CompTIA Security+, AWS">
                </div>

                <div id="hidden-step1-fields"></div>

                <div class="form-actions split-actions">
                    <a href="index.html" class="btn-back">Back to Step 1</a>
                    <button type="submit" class="btn-next">Proceed to Step 3</button>
                </div>
            </fieldset>
        </form>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const hiddenContainer = document.getElementById('hidden-step1-fields');
        const greeting = document.getElementById('respondent-greeting');

        const title = params.get('title') || '';
        const fullName = params.get('full_name') || 'Respondent';
        const category = params.get('category') || 'Not specified';

        greeting.textContent = `Assessing: ${title} ${fullName} (${category})`;

        params.forEach((value, key) => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = value;
            hiddenContainer.appendChild(input);
        });
    </script>

</body>
</html>
